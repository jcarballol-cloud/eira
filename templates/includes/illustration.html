<picture class="illus{% if css %} {{ css }}{% endif %}">{% if night_avif %}
  <source media="(prefers-color-scheme: dark)" type="image/avif" srcset="{{ night_avif }}" sizes="{{ sizes }}">
  <source media="(prefers-color-scheme: dark)" type="image/webp" srcset="{{ night_webp }}" sizes="{{ sizes }}">{% endif %}
  <source type="image/avif" srcset="{{ avif }}" sizes="{{ sizes }}">
  <source type="image/webp" srcset="{{ webp }}" sizes="{{ sizes }}">
  <img src="{{ src }}" alt="" width="{{ width }}" height="{{ height }}" decoding="async" {% if eager %}loading="eager" fetchpriority="high"{% else %}loading="lazy"{% endif %}>
</picture>
