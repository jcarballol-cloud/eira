{% load i18n eira %}<div class="page-head"><div><p class="eyebrow">{% translate "Instalación" %}</p><h1>{{ facility.name }}</h1></div>
  <a class="btn btn-secondary" href="{% turl 'facilities:detail' facility.pk %}">{% translate "Ver ficha pública" %}</a></div>
<nav class="row mb-2" aria-label="{% translate 'Apartados da instalación' %}">
  <a class="btn btn-sm {% if tab != 'data' %}btn-secondary{% endif %}" href="{% turl 'manage:facility_edit' facility.pk %}" {% if tab == 'data' %}aria-current="page"{% endif %}>{% translate "Datos" %}</a>
  <a class="btn btn-sm {% if tab != 'hours' %}btn-secondary{% endif %}" href="{% turl 'manage:facility_hours' facility.pk %}" {% if tab == 'hours' %}aria-current="page"{% endif %}>{% translate "Horario" %}</a>
  <a class="btn btn-sm {% if tab != 'tariffs' %}btn-secondary{% endif %}" href="{% turl 'manage:facility_tariffs' facility.pk %}" {% if tab == 'tariffs' %}aria-current="page"{% endif %}>{% translate "Tarifas" %}</a>
  <a class="btn btn-sm {% if tab != 'rules' %}btn-secondary{% endif %}" href="{% turl 'manage:facility_rules' facility.pk %}" {% if tab == 'rules' %}aria-current="page"{% endif %}>{% translate "Normas" %}</a>
  <a class="btn btn-sm btn-secondary" href="{% turl 'manage:facility_qr' facility.pk %}">{% translate "Cartel QR" %}</a>
</nav>
