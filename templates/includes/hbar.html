{% load i18n l10n %}{% localize off %}<figure class="mb-0">
  <svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-labelledby="{{ cid }}-t {{ cid }}-d">
    <title id="{{ cid }}-t">{{ title }}</title>
    <desc id="{{ cid }}-d">{% translate "Os mesmos datos están na táboa que segue ao gráfico." %}</desc>
    {% for b in chart.bars %}
      <text x="{{ chart.x0|add:'-10' }}" y="{{ b.text_y }}" text-anchor="end">{{ b.label|truncatechars:22 }}</text>
      <rect class="bar{% if warn %} bar-warn{% endif %}" x="{{ chart.x0 }}" y="{{ b.y }}" width="{{ b.w }}" height="24" rx="4"></rect>
      <text class="val" x="{{ b.val_x }}" y="{{ b.text_y }}">{{ b.display }}</text>
    {% endfor %}
  </svg>
</figure>{% endlocalize %}
