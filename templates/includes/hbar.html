{% load i18n eira %}<figure class="mb-0 hbars" aria-labelledby="{{ cid }}-t">
  <figcaption id="{{ cid }}-t" class="visually-hidden">{{ title }}</figcaption>
  <ul class="list">
    {% for b in chart.bars %}
    <li class="hbar-row">
      <span class="hbar-label">{{ b.label }}</span>
      <span class="hbar-track" aria-hidden="true"><span class="hbar-fill{% if warn %} warn{% endif %} w-{{ b.pct|bucket5 }}"></span></span>
      <span class="hbar-value">{{ b.display }}</span>
    </li>
    {% empty %}<li class="muted">{% translate "Sen datos no período." %}</li>{% endfor %}
  </ul>
  {% if chart.bars %}<p class="hbar-scale">{% if chart.scale == "max" %}{% blocktranslate with m=chart.top_display %}Barras relativas ao valor máis alto ({{ m }}).{% endblocktranslate %}{% else %}{% blocktranslate with m=chart.top_display %}Escala de 0 a {{ m }}.{% endblocktranslate %}{% endif %}</p>{% endif %}
</figure>
