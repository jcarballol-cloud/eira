name: Eira
url: "https://github.com/jcarballol-cloud/eira"
releaseDate: "2026-11-18"
softwareVersion: "1.5.1"
platforms:
  - web
categories:
  - facility-management
  - appointment-scheduling
developmentStatus: development
softwareType: standalone/web
description:
  gl:
    shortDescription: Software libre para a xestión deportiva municipal. Reservas, acceso ás instalacións, mantemento e actividades.
    longDescription: >
      Eira cobre o ciclo completo de cada instalación deportiva municipal: atopar, reservar, pagar,
      acceder, usar, pechar e avisar, manter e medir. Inclúe acceso por niveis (QR, chave custodiada,
      código temporal que funciona sen conexión e pechadura conectada), avisos de avaría con foto,
      mantemento preventivo con app do operario sen cobertura, escolas deportivas, indicadores e
      datos abertos. É multi-concello e pensado para despregarse nunha deputación ou mancomunidade,
      con exportación íntegra dos datos en formatos abertos.
    features:
      - Consulta e reserva en liña accesible (WCAG 2.1 AA) en galego e castelán
      - Acceso sen conserxe con códigos temporais sen conexión
      - Incidencias e mantemento preventivo
      - Indicadores, datos abertos DCAT-AP e API OpenAPI 3.1
      - Multi-concello con vista de deputación
      - Dobre factor (TOTP) para as contas de xestión e rexistro de auditoría
  es:
    shortDescription: Software libre para la gestión deportiva municipal. Reservas, acceso a las instalaciones, mantenimiento y actividades.
    longDescription: >
      Eira cubre el ciclo completo de cada instalación deportiva municipal: encontrar, reservar, pagar,
      acceder, usar, cerrar y avisar, mantener y medir, con acceso por niveles sin conserje,
      incidencias, mantenimiento preventivo, escuelas deportivas, indicadores y datos abiertos.
    features:
      - Reserva online accesible en gallego y castellano
      - Acceso sin conserje con códigos temporales sin conexión
      - Incidencias y mantenimiento preventivo
      - Multi-municipio con vista de diputación
      - Doble factor (TOTP) para las cuentas de gestión y registro de auditoría
